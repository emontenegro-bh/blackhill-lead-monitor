name: City Bid Monitor

on:
  schedule:
    - cron: '7 12 * * *'  # 7:07 AM CDT / 6:07 AM CST daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scan and print, send no email and write no state'
        type: boolean
        default: false

concurrency:
  group: bid-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Scan city bid sources
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/bid-monitor.py ${{ inputs.dry_run == true && '--dry-run' || '' }}

      # The "Persist bid state" step is gone: the 560-entry seen-map lives in
      # Supabase (automation_state, 'bid-monitor'). Same swallow-the-failure
      # push loop as the others -- `git push && break || sleep 2` exits the
      # loop successfully after three failures -- and here that bug was the
      # most expensive of the set: an unpushed seen-map means the next 7:07am
      # run treats every open posting across 48 sources as new.

  notify-failure:
    needs: [scan]
    if: failure() || cancelled()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: "City Bid Monitor"
    secrets: inherit
