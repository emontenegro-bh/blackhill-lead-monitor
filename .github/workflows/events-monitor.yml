name: Networking Events Monitor

on:
  schedule:
    # Monthly digest, 1st of the month, 7:13 AM CDT / 6:13 AM CST
    - cron: '13 12 1 * *'
    # New-event check, Mondays and Thursdays. Event announcements are not
    # hour-sensitive, and twice a week keeps the inbox quiet.
    - cron: '13 12 * * 1,4'
  workflow_dispatch:
    inputs:
      monthly:
        description: 'Send the full monthly digest instead of new-events-only'
        type: boolean
        default: false
      dry_run:
        description: 'Scan and print, send no email and write no state'
        type: boolean
        default: false

concurrency:
  group: events-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Decide mode
        id: mode
        run: |
          # --dry-run wins outright. Without this precedence a dispatch with
          # both boxes ticked would send the full monthly digest for real,
          # which is the loudest possible way to test a change.
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.monthly }}" = "true" ] || [ "$(date -u +%d)" = "01" ]; then
            echo "flag=--monthly" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan for events
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          EVENTS_MAILBOX: ${{ vars.EVENTS_MAILBOX || 'evelin@blackhilltx.com' }}
          EVENTS_RECIPIENTS: ${{ vars.EVENTS_RECIPIENTS || 'evelin@blackhilltx.com' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/events-monitor.py ${{ steps.mode.outputs.flag }}

      # The "Persist events state" step is gone: seen-keys, source_failures and
      # last_monthly live in Supabase (automation_state, 'events-monitor').
      # Its push loop had the same swallow-the-failure shape as the Mailchimp
      # one -- `git push && break || sleep 2` retries three times then exits
      # the loop successfully -- so a seen-list that never got pushed looked
      # like a clean run, and the next digest re-reported events already sent.

  notify-failure:
    needs: [scan]
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: "Networking Events Monitor"
    secrets: inherit
