name: Crew Location Report

on:
  # Primary trigger: an external cron service (cron-job.org) POSTs a
  # repository_dispatch at ~3:55pm Central on weekdays. On-demand dispatches run
  # within seconds, so they avoid GitHub's unreliable *scheduled*-job queue that
  # was delaying / dropping the 4pm email. See repo README for the cron-job setup.
  repository_dispatch:
    types: [crew-location-report]
  # Late backstop, weekdays. NOT a replacement for the dispatch above: GitHub's
  # scheduled queue is why that exists, and measurements on 2026-08-22 put the
  # lag at 20-60 minutes with heavy throttling of frequent crons. This fires an
  # hour after the real trigger should have, so if cron-job.org is down the
  # report still goes out late rather than not at all. The script is idempotent
  # -- it reads Azuga and emails -- so a duplicate on a day both fire is a
  # second copy of the same email, which is a far cheaper failure than silence.
  schedule:
    - cron: '52 21 * * 1-5'
  workflow_dispatch:
    inputs:
      to:
        description: 'Override email recipients (comma-separated). Blank = default (evelin + denisse).'
        required: false
        default: ''

concurrency:
  group: crew-location
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Send crew location report
        env:
          AZUGA_API_KEY: ${{ secrets.AZUGA_API_KEY }}
          # Email-only delivery. This report is intentionally NOT posted to Teams:
          # it shares the leads webhook (TEAMS_WEBHOOK_URL), whose Power Automate
          # flow only renders adaptive-card payloads, so the plain-text crew report
          # silently failed that flow (~6/week) while still returning HTTP 202.
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CREW_LOC_TO: ${{ github.event.inputs.to }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/crew-location.py ${{ github.event_name == 'schedule' && '--backstop' || '' }}

  notify-failure:
    needs: [report]
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: "Crew Location Report"
    secrets: inherit
