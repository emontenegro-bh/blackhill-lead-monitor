name: Lead Monitor (sales@ mailbox)

on:
  schedule:
    # Offset from lead-monitor.yml, which uses '*/5'. Kept, but note that
    # the collision theory it was added for turned out to be WRONG: offsetting
    # changed nothing, because lead-monitor.yml is not really driven by its
    # cron at all. An external scheduler dispatches that one every 5 minutes
    # while this workflow has no such dispatcher and lives on GitHub's
    # scheduled queue, which delivers 1-3 runs a day.
    #
    # That is the actual gap. This pipeline reads sales@meangreenlawncare.com
    # and caught 50 leads in the 20 days to 2026-08-29 that WhatConverts never
    # saw -- zero overlap between the two. Those leads wait hours for an
    # auto-reply that promises contact before 5pm.
    - cron: '2-57/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: email-lead-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install msal

      - name: Poll email for leads
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_USER_EMAIL: ${{ secrets.MS_USER_EMAIL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          LEAD_RECIPIENTS: ${{ secrets.LEAD_RECIPIENTS }}
          SPAM_RECIPIENTS: ${{ secrets.SPAM_RECIPIENTS }}
          NOTIFY_FROM_EMAIL: ${{ secrets.NOTIFY_FROM_EMAIL }}
          AUTO_REPLY_FROM: ${{ secrets.AUTO_REPLY_FROM }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_SERVER: ${{ secrets.MAILCHIMP_SERVER }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          ASPIRE_CLIENT_ID: ${{ secrets.ASPIRE_CLIENT_ID }}
          ASPIRE_SECRET: ${{ secrets.ASPIRE_SECRET }}
          SPAM_AUTO_FILTER: "true"
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/lead-monitor.py


  notify-failure:
    needs: [monitor]
    if: failure() || cancelled()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: "Email Lead Monitor"
    secrets: inherit
