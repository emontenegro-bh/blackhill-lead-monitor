name: Notify on Failure

on:
  workflow_call:
    inputs:
      workflow_name:
        description: 'Human-readable name of the failed workflow'
        required: true
        type: string
      only_if_previous_failed:
        description: >
          Alert only when the PREVIOUS run of this workflow also failed.
          Set true for pipelines that run every few minutes, where one blip is
          noise and self-heals on the next tick. Leave false (the default) for
          daily and weekly jobs, where a single failure means it did not run at
          all and nothing will retry it.
        required: false
        default: false
        type: boolean

jobs:
  send-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      # Suppression, for high-frequency pipelines only.
      #
      # Between 2026-09-13 and 09-15 the lead workflows failed 4 times in about
      # 2,000 runs, every one a transient Supabase 504 or a GitHub API 5xx that
      # succeeded again two minutes later. Each still emailed, and nothing ever
      # said it had recovered, so a 0.2% blip rate read as constant breakage.
      #
      # Two consecutive failures is the signal worth waking up for. One is not.
      - name: Should this alert be sent?
        id: gate
        if: inputs.only_if_previous_failed
        # A crash here must never swallow an alert. If this step dies the
        # output is empty, and the send condition below treats anything other
        # than an explicit 'false' as "send it".
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: python
        run: |
          import json, os, subprocess

          def api(path):
              out = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              return json.loads(out.stdout) if out.returncode == 0 else None

          repo, run_id = os.environ["REPO"], os.environ["RUN_ID"]

          # A called workflow shares the caller's run id, so this resolves the
          # CALLER's workflow, which is the one whose history we care about.
          this_run = api(f"repos/{repo}/actions/runs/{run_id}")
          send = True
          if this_run:
              wf = this_run["workflow_id"]
              branch = this_run.get("head_branch") or "main"
              runs = api(f"repos/{repo}/actions/workflows/{wf}/runs"
                         f"?branch={branch}&status=completed&per_page=10")
              prev = [r for r in (runs or {}).get("workflow_runs", [])
                      if r["id"] != int(run_id)]
              if prev:
                  last = prev[0]["conclusion"]
                  # Only 'success' proves it recovered. A cancelled or skipped
                  # previous run tells us nothing, so alert rather than assume.
                  if last == "success":
                      send = False
                      print(f"Previous run concluded {last}; single blip, not alerting.")
                  else:
                      print(f"Previous run concluded {last}; second failure in a row, alerting.")
              else:
                  print("No previous run found; alerting.")
          else:
              # Never swallow an alert because the lookup itself broke.
              print("Could not read run history; alerting to be safe.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"send={'true' if send else 'false'}\n")

      - name: Send failure email
        # Only an explicit 'false' suppresses. Empty (gate crashed or was
        # skipped) still sends, because a missed alert is worse than a spare one.
        if: ${{ !inputs.only_if_previous_failed || steps.gate.outputs.send != 'false' }}
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import smtplib, os
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.utils import formataddr

          name = os.environ['WORKFLOW_NAME']
          url = os.environ['RUN_URL']
          sender = os.environ['GMAIL_EMAIL']

          msg = MIMEMultipart('alternative')
          msg['Subject'] = f'[ALERT] {name} failed'
          msg['From'] = formataddr(('Black Hill Assistant', sender))
          msg['To'] = 'evelin@blackhilltx.com'

          body = f'''<h3>Workflow Failure: {name}</h3>
          <p>A GitHub Actions workflow failed and needs attention.</p>
          <p><a href="{url}">View failed run</a></p>
          <p style="color:#888;font-size:12px">Sent by Black Hill automation monitor</p>'''

          msg.attach(MIMEText(f'{name} failed. View: {url}', 'plain'))
          msg.attach(MIMEText(body, 'html'))

          with smtplib.SMTP('smtp.gmail.com', 587) as s:
              s.starttls()
              s.login(sender, os.environ['GMAIL_APP_PASSWORD'])
              s.sendmail(sender, 'evelin@blackhilltx.com', msg.as_string())
          print(f'Failure alert sent for: {name}')
