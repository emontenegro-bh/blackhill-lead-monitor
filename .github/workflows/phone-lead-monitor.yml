name: Phone Lead Monitor

on:
  schedule:
    # Backstop only. Real-time routing is driven by Power Automate calling
    # workflow_dispatch on each form submission; GitHub throttles frequent
    # schedules to hours anyway, so this is just a safety net + the reconcile.
    - cron: '17,47 * * * *'
  workflow_dispatch: {}

concurrency:
  group: phone-lead-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install msal

      - name: Poll phone-lead form and sync CRM
        env:
          PHONE_MS_CLIENT_ID: ${{ secrets.PHONE_MS_CLIENT_ID }}
          PHONE_MS_TENANT_ID: ${{ secrets.PHONE_MS_TENANT_ID }}
          PHONE_MS_CLIENT_SECRET: ${{ secrets.PHONE_MS_CLIENT_SECRET }}
          PHONE_MS_USER_EMAIL: ${{ secrets.PHONE_MS_USER_EMAIL }}
          ASPIRE_CLIENT_ID: ${{ secrets.ASPIRE_CLIENT_ID }}
          ASPIRE_SECRET: ${{ secrets.ASPIRE_SECRET }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/phone-lead-monitor.py


  notify-failure:
    needs: [monitor]
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: "Phone Lead Monitor"
    secrets: inherit
