name: Phone Lead Monitor

on:
  schedule:
    # Backstop only, and GitHub throttles frequent schedules under load, so do
    # not read this as the real cadence -- see below for what actually drives it.
    #
    # Was '17,47' (every 30 min) until 2026-09-02. Matched to lead-monitor's
    # '*/5' so that if the external dispatcher ever stops, phone leads degrade
    # to the same worst case as web leads instead of a far worse one.
    - cron: '*/5 * * * *'

  # WHAT ACTUALLY DRIVES THIS
  #
  # An external scheduler (cron-job.org) POSTs a workflow_dispatch on a fixed
  # interval, the same workaround lead-monitor uses because GitHub silently
  # throttles scheduled runs.
  #
  # This block used to claim "Real-time routing is driven by Power Automate
  # calling workflow_dispatch on each form submission". That is not happening.
  # Of the last 93 dispatches, 92 landed exactly on a 15-minute boundary and
  # the only exception was a hand-run job -- so every dispatch came from the
  # timer and none from a form submission. Whether Power Automate ever worked
  # or silently stopped is unresolved; either way nothing is event-driven today
  # and a lead waits for the next tick.
  workflow_dispatch: {}

concurrency:
  group: phone-lead-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install msal

      - name: Poll phone-lead form and sync CRM
        env:
          PHONE_MS_CLIENT_ID: ${{ secrets.PHONE_MS_CLIENT_ID }}
          PHONE_MS_TENANT_ID: ${{ secrets.PHONE_MS_TENANT_ID }}
          PHONE_MS_CLIENT_SECRET: ${{ secrets.PHONE_MS_CLIENT_SECRET }}
          PHONE_MS_USER_EMAIL: ${{ secrets.PHONE_MS_USER_EMAIL }}
          ASPIRE_CLIENT_ID: ${{ secrets.ASPIRE_CLIENT_ID }}
          ASPIRE_SECRET: ${{ secrets.ASPIRE_SECRET }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          WC_API_TOKEN: ${{ secrets.WC_API_TOKEN }}
          WC_API_SECRET: ${{ secrets.WC_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/phone-lead-monitor.py


  notify-failure:
    needs: [monitor]
    if: failure() || cancelled()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: "Phone Lead Monitor"
    secrets: inherit
