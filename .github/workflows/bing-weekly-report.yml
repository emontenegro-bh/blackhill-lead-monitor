name: Weekly Bing Ads Report

on:
  schedule:
    # Sunday 9:22 AM Central = 14:22 UTC (CDT). Offset from the Google Ads
    # report at 15:07 UTC so the two Sunday sends do not land together, and
    # off-:00 because GitHub drops exactly-:00 crons.
    - cron: '22 14 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'normal | dry-run (build the report, send no email)'
        required: false
        default: 'normal'

concurrency:
  group: bing-weekly-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install bingads

      - name: Generate and send weekly report
        env:
          BING_ADS_DEVELOPER_TOKEN: ${{ secrets.BING_ADS_DEVELOPER_TOKEN }}
          BING_ADS_CLIENT_ID: ${{ secrets.BING_ADS_CLIENT_ID }}
          BING_ADS_CLIENT_SECRET: ${{ secrets.BING_ADS_CLIENT_SECRET }}
          BING_ADS_REFRESH_TOKEN: ${{ secrets.BING_ADS_REFRESH_TOKEN }}
          BING_ADS_CUSTOMER_ID: ${{ secrets.BING_ADS_CUSTOMER_ID }}
          BING_ADS_ACCOUNT_ID: ${{ secrets.BING_ADS_ACCOUNT_ID }}
          BING_ADS_REDIRECT_URI: ${{ secrets.BING_ADS_REDIRECT_URI }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          FLAG=""
          [ "${{ github.event.inputs.mode }}" = "dry-run" ] && FLAG="--dry-run"
          python scripts/bing-weekly-report.py $FLAG

      - name: Commit weekly report archive
        if: github.event.inputs.mode != 'dry-run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/reports/marketing/bing-ads/weekly/*.md || true
          if git diff --staged --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Weekly Bing Ads report - $(date +%Y-%m-%d)"
          # main races with state-file bots; retry rebase+push before failing
          # (see feedback_lead_monitor_push_rebase).
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i lost the race; retrying..."
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts."
          exit 1

  notify-failure:
    needs: [report]
    if: failure() || cancelled()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: "Weekly Bing Ads Report"
    secrets: inherit
