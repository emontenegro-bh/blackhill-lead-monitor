name: Aspire to Mailchimp Sync

on:
  schedule:
    - cron: '0 12 * * *'  # 6 AM CST / 7 AM CDT daily
  workflow_dispatch: {}

concurrency:
  group: aspire-mailchimp-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Sync new Aspire contacts to Mailchimp
        env:
          ASPIRE_CLIENT_ID: ${{ secrets.ASPIRE_CLIENT_ID }}
          ASPIRE_SECRET: ${{ secrets.ASPIRE_SECRET }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_SERVER: ${{ secrets.MAILCHIMP_SERVER }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/aspire-mailchimp-backfill.py

      # The "Persist sync state" step is gone: the cursor lives in Supabase
      # (automation_state, 'aspire-mailchimp-backfill'). Its push loop also
      # swallowed failures -- `git push && break || sleep 2` retries three
      # times and then falls out of the loop successfully, so a cursor that
      # never got pushed looked like a clean run. The next run would then
      # re-sync from the stale cursor and re-tag contacts in Mailchimp.
      # save_state() either writes or raises.

  notify-failure:
    needs: [sync]
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: "Aspire to Mailchimp Sync"
    secrets: inherit
