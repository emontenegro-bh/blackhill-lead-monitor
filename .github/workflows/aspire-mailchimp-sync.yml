name: Aspire to Mailchimp Sync

on:
  schedule:
    - cron: '17 12 * * *'  # 6:17 AM CST / 7:17 AM CDT. Off-:00 deliberately:
                           # GitHub deprioritises exactly-:00 crons and this job
                           # was landing 3-7 hours late (15:29Z-19:03Z, Sep 25-Oct 2).
  workflow_dispatch: {}

concurrency:
  group: aspire-mailchimp-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Sync new Aspire contacts to Mailchimp
        env:
          ASPIRE_CLIENT_ID: ${{ secrets.ASPIRE_CLIENT_ID }}
          ASPIRE_SECRET: ${{ secrets.ASPIRE_SECRET }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_SERVER: ${{ secrets.MAILCHIMP_SERVER }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/aspire-mailchimp-backfill.py

      # Service tags come from won opportunities, not from the contact record,
      # so this runs after the contact sync and re-derives the whole map each
      # time. It only ever adds missing tags, so re-running is a no-op once
      # everyone is current. Tags are svc-*; they are deliberately not the
      # pre-existing irrigation-customer tag, which a Customer Journey may be
      # triggering on.
      - name: Tag Mailchimp contacts by purchased service division
        env:
          ASPIRE_CLIENT_ID: ${{ secrets.ASPIRE_CLIENT_ID }}
          ASPIRE_SECRET: ${{ secrets.ASPIRE_SECRET }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_SERVER: ${{ secrets.MAILCHIMP_SERVER }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
        run: python scripts/aspire-mailchimp-service-tags.py --live

      # The "Persist sync state" step is gone: the cursor lives in Supabase
      # (automation_state, 'aspire-mailchimp-backfill'). Its push loop also
      # swallowed failures -- `git push && break || sleep 2` retries three
      # times and then falls out of the loop successfully, so a cursor that
      # never got pushed looked like a clean run. The next run would then
      # re-sync from the stale cursor and re-tag contacts in Mailchimp.
      # save_state() either writes or raises.

  notify-failure:
    needs: [sync]
    if: failure() || cancelled()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: "Aspire to Mailchimp Sync"
    secrets: inherit
