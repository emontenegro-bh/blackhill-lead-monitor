name: Phone Lead Staleness Alert

# Insurance: emails Evelin if the phone-lead monitor hasn't processed a new
# lead in >= 2 business days (weekends skipped). Reads the monitor's Supabase
# state rather than the workbook, so it fires even when the Graph read, the
# Forms intake, or Power Automate is broken.

on:
  # Primary trigger: cron-job.org POSTs a repository_dispatch at ~08:23 Central
  # on weekdays. Same reason as the other dispatched workflows -- GitHub's
  # scheduled queue lags 20-60 minutes under throttling, and on 2026-09-30 this
  # workflow's 08:23 cron was observed firing at 13:39 and 15:08. An insurance
  # alert that lands hours late is half an alert.
  repository_dispatch:
    types: [phone-lead-staleness]
  # Late backstop, weekdays, ~90 minutes after the dispatch should have landed.
  # Kept because this is the alert of last resort: if cron-job.org is down too,
  # a late warning still beats silence. Duplicate runs are harmless -- the
  # script dedupes alerts per calendar day via its own Supabase state, so the
  # second run prints "Already alerted today" and sends nothing.
  schedule:
    - cron: '53 14 * * 1-5'   # 09:53 CT, weekdays (off-:00 so GitHub doesn't drop it)
  workflow_dispatch: {}

concurrency:
  group: phone-lead-staleness
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check phone-lead staleness
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: evelin@blackhilltx.com
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/phone-lead-staleness-check.py

      - name: Commit alert state (dedupe tracking)
        run: |
          git config user.name "blackhill-bot"
          git config user.email "bot@blackhilltx.com"
          git add data/phone-lead-staleness-state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            for i in 1 2 3 4 5; do
              git commit -m "chore: phone-lead staleness alert state" && \
              git pull --rebase && git push && break || sleep 3
            done
          fi

  notify-failure:
    needs: check
    if: failure() || cancelled()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: Phone Lead Staleness Alert
    secrets: inherit
