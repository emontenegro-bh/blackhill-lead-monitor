name: FW Irrigation Monitor

# Fort Worth Water sends irrigation quote requests to the
# irrigation@blackhilltx.com shared mailbox. This posts one Teams card per
# work order and threads the PO underneath when it arrives.
#
# THE REAL CADENCE COMES FROM cron-job.org, NOT FROM THE CRON BELOW.
#
# GitHub delivers scheduled workflows best-effort and drops them under load;
# this repo measured 98 workflow_dispatch runs against 2 schedule runs in
# one window. This workflow shipped on the native cron and proved the point
# the hard way: between 2026-10-10 and 2026-10-12 not one scheduled slot
# fired, and six Fort Worth quote requests sat unannounced until a manual
# dispatch picked them up. Same pattern as phone-lead-monitor.yml.
#
# The cron below is a BACKSTOP only, deliberately slower than the external
# dispatcher so the two do not race. The 24-hour lookback plus work-order
# dedupe means a backstop run after a dispatcher outage catches up rather
# than duplicating.
#
# Business hours, weekdays. Fort Worth's Field Operations Division sends
# between about 8am and 3pm Central. A request arriving overnight is not
# lost: the lookback covers it on the first morning run.
#
# Off-:00 minutes because GitHub silently drops exactly-:00 crons.

on:
  schedule:
    - cron: '13,43 11-23 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'normal | dry-run (parse and print, post nothing) | test (mailbox access only)'
        required: false
        default: 'normal'
      lookback_minutes:
        description: 'How far back to read. Blank uses the 1440-minute default. Raise it to replay a backlog after an outage; dedupe on the work order number makes that safe.'
        required: false
        default: ''

concurrency:
  group: fw-irrigation-monitor
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install msal

      - name: Scan the irrigation mailbox
        env:
          # Graph app credentials, shared with lead-monitor.py.
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          # State lives in Supabase, never in the repo: the work-order to
          # Teams-message-id map is what lets a PO thread under its request
          # card. See check-no-repo-state.py.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Pulls the parts list out of the quoted Maximo dispatch. Without
          # it the card still posts, showing the raw dispatch text instead.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Power Automate flow for the FW Irrigation channel: a Microsoft
          # Teams Webhook trigger posting the adaptive card, the same free
          # shape as the existing "Send webhook alerts to Leads Alert" flow.
          # Threading the PO under its request card would need the premium
          # Request connector; see the note in fw-irrigation-monitor.py.
          FW_TEAMS_WEBHOOK_URL: ${{ secrets.FW_TEAMS_WEBHOOK_URL }}
          # Blank falls through to the script's own 1440-minute default.
          FW_LOOKBACK_MINUTES: ${{ github.event.inputs.lookback_minutes }}
        run: |
          FLAG=""
          case "${{ github.event.inputs.mode }}" in
            dry-run) FLAG="--dry-run" ;;
            test)    FLAG="--test" ;;
          esac
          python scripts/fw-irrigation-monitor.py $FLAG

  # This workflow runs every couple of minutes against a mailbox that is
  # occasionally slow or 5xx on Microsoft's side, and the run is idempotent:
  # a failed scan is picked up by the next one a few minutes later. Alerting
  # on each failure meant 53 emails in two hours on 2026-11-12 for a problem
  # nobody could act on. Only alert once the failure has actually persisted,
  # the same rule bid-monitor.py applies to a broken source.
  gate:
    needs: [monitor]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      alert: ${{ steps.check.outputs.alert }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The two most recent *completed* runs before this one. If either
          # succeeded, this is a blip and the next run will recover.
          prev=$(gh api "repos/$REPO/actions/workflows/fw-irrigation-monitor.yml/runs?status=completed&per_page=3" \
                 --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | .conclusion] | .[0:2] | join(",")')
          echo "previous two conclusions: ${prev:-none}"
          case "$prev" in
            *success*|"") echo "alert=false" >> "$GITHUB_OUTPUT" ;;
            *)            echo "alert=true"  >> "$GITHUB_OUTPUT" ;;
          esac

  notify-failure:
    needs: [gate]
    # `|| cancelled()` on the monitor job because a job killed by
    # timeout-minutes concludes `cancelled`, not `failure`, and plain
    # `if: failure()` cannot see it. The gate job encodes that already.
    if: needs.gate.outputs.alert == 'true'
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: "FW Irrigation Monitor (3+ consecutive failures)"
    secrets: inherit
