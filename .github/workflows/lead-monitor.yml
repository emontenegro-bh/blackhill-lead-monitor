name: Lead Monitor (WhatConverts)

on:
  # THE CRON IS NOT WHAT ACTUALLY RUNS THIS. Measured 2026-08-24..29: 2
  # scheduled runs against 98 workflow_dispatch. An external scheduler POSTs
  # a workflow_dispatch here every 5 minutes on the dot, the same workaround
  # crew-location.yml documents for the same reason -- GitHub's scheduled
  # queue drops runs under load and delivers a fraction of what is asked for.
  #
  # DO NOT RENAME THIS FILE. The dispatcher targets it by filename; renaming
  # gives the workflow a new id, the POST 404s, and the lead pipeline stops
  # with no error anywhere. The cron below is a weak fallback, not the
  # primary trigger.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: lead-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run WhatConverts lead monitor
        env:
          WC_API_TOKEN: ${{ secrets.WC_API_TOKEN }}
          WC_API_SECRET: ${{ secrets.WC_API_SECRET }}
          WC_PROFILE_ID: ${{ secrets.WC_PROFILE_ID }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LEAD_RECIPIENTS: ${{ secrets.LEAD_RECIPIENTS }}
          SPAM_RECIPIENTS: ${{ secrets.SPAM_RECIPIENTS }}
          NOTIFY_FROM_EMAIL: ${{ secrets.NOTIFY_FROM_EMAIL }}
          AUTO_REPLY_FROM: ${{ secrets.AUTO_REPLY_FROM }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_SERVER: ${{ secrets.MAILCHIMP_SERVER }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          ASPIRE_CLIENT_ID: ${{ secrets.ASPIRE_CLIENT_ID }}
          ASPIRE_SECRET: ${{ secrets.ASPIRE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/whatconverts-lead-monitor.py


  notify-failure:
    needs: [monitor]
    if: failure() || cancelled()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: "Lead Monitor"
    secrets: inherit
